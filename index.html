<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; connect-src https://raw.githubusercontent.com; frame-src 'none'; object-src 'none'; base-uri 'none'">
<title>OblivionX — Starting</title>
<link rel="icon" href="icon.png">
<style>
:root{--ui-font:'Segoe UI',Arial,sans-serif;--window-radius:16px;--accent:#fbbf24;--ok:#86efac;--err:#fca5a5;}
*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden;background:#100c0b;color:#fff;}
  /* ── BOOTSTRAPPER ─────────────────────────────────────────────────────── */
  .bx{position:fixed;inset:0;z-index:1000;overflow:hidden;background:#05030d;color:#fff;font-family:var(--ui-font);border-radius:var(--window-radius);-webkit-user-select:none;user-select:none;cursor:default;transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1),filter .7s ease;}
  .bx.bx-out{opacity:0;transform:scale(1.04);filter:blur(6px);pointer-events:none;}
  .bx[hidden]{display:none;}
  .bx-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
  .bx-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1s ease;pointer-events:none;}
  .bx.bx-video-on .bx-video{opacity:1;}
  .bx.bx-video-on .bx-canvas{visibility:hidden;}
  .bx.bx-video-on .bx-grain{opacity:.25;}
  .bx.bx-video-on .bx-vignette{background:radial-gradient(ellipse 55% 42% at 50% 46%,rgba(5,3,13,.55) 0%,rgba(5,3,13,.25) 60%,rgba(5,3,13,0) 100%),radial-gradient(ellipse at 50% 46%,rgba(5,3,13,0) 35%,rgba(5,3,13,.7) 100%),linear-gradient(180deg,rgba(5,3,13,.35),rgba(5,3,13,0) 25%,rgba(5,3,13,0) 70%,rgba(5,3,13,.65));}
  .bx.bx-video-on .bx-fill{background:linear-gradient(90deg,#f97316,#fbbf24 60%,#fff);box-shadow:0 0 14px rgba(251,146,60,.75);}
  .bx.bx-video-on .bx-mark{filter:drop-shadow(0 0 18px rgba(251,146,60,.55));}
  .bx.bx-video-on .bx-ring .arc2{stroke:#fbbf24;}
  .bx.bx-video-on .bx-name{text-shadow:0 4px 30px rgba(0,0,0,.6),0 0 40px rgba(251,146,60,.35);}
  .bx.bx-video-on .bx-name span.x{background:linear-gradient(110deg,#fff 0%,#fde68a 45%,#fff 70%,#fff 100%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;}
  .bx-vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 46%,rgba(5,3,13,0) 0%,rgba(5,3,13,.25) 55%,rgba(5,3,13,.82) 100%),linear-gradient(180deg,rgba(5,3,13,.35),rgba(5,3,13,0) 30%,rgba(5,3,13,0) 65%,rgba(5,3,13,.7));}
  .bx-grain{position:absolute;inset:0;pointer-events:none;opacity:.5;background:repeating-linear-gradient(0deg,transparent 0 2px,rgba(0,0,0,.10) 2px 4px);}
  .bx-drag{position:absolute;left:0;right:0;top:0;height:40px;-webkit-app-region:drag;}
  .bx-close{position:absolute;top:10px;right:12px;width:28px;height:28px;border-radius:8px;border:none;background:transparent;color:rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-app-region:no-drag;transition:background .15s,color .15s;}
  .bx-close:hover{background:rgba(255,80,80,.22);color:#fff;}
  .bx-close svg{width:15px;height:15px;}

  .bx-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding-bottom:40px;}
  .bx-lockup{display:flex;align-items:center;gap:22px;opacity:0;transform:translateY(14px) scale(.96);animation:bxLockIn 1s .15s cubic-bezier(.2,.8,.2,1) forwards;}
  @keyframes bxLockIn{to{opacity:1;transform:none;}}
  .bx-mark{position:relative;width:84px;height:84px;flex-shrink:0;filter:drop-shadow(0 0 18px rgba(168,85,247,.55));animation:bxFloat 4.5s ease-in-out infinite;}
  @keyframes bxFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);}}
  .bx-ring{position:absolute;inset:0;width:100%;height:100%;}
  .bx-ring .track{fill:none;stroke:rgba(255,255,255,.16);stroke-width:2.5;}
  .bx-ring .arc{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-dasharray:90 190;transform-origin:50% 50%;animation:bxSpin 1.6s cubic-bezier(.5,.1,.5,.9) infinite;}
  .bx-ring .arc2{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-dasharray:20 270;opacity:.9;transform-origin:50% 50%;animation:bxSpin 2.7s linear infinite reverse;}
  @keyframes bxSpin{to{transform:rotate(360deg);}}
  .bx-logo{position:absolute;inset:19px;display:flex;align-items:center;justify-content:center;animation:bxPulse 2.8s ease-in-out infinite;}
  .bx-logo img,.bx-logo svg{width:100%;height:100%;object-fit:contain;color:#fff;display:block;}
  @keyframes bxPulse{0%,100%{transform:scale(1);filter:brightness(1);}50%{transform:scale(1.07);filter:brightness(1.25);}}
  .bx-name{font-size:64px;font-weight:700;letter-spacing:-.03em;line-height:1;display:flex;text-shadow:0 4px 30px rgba(0,0,0,.45),0 0 40px rgba(168,85,247,.35);}
  .bx-name span{display:inline-block;opacity:0;transform:translateY(18px);animation:bxLetter .7s cubic-bezier(.2,.8,.2,1) forwards;}
  .bx-name span.x{background:linear-gradient(110deg,#fff 0%,#e9d5ff 45%,#fff 70%,#fff 100%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:bxLetter .7s cubic-bezier(.2,.8,.2,1) forwards,bxShine 3.2s 1.4s ease-in-out infinite;}
  @keyframes bxLetter{to{opacity:1;transform:none;}}
  @keyframes bxShine{0%{background-position:120% 0;}60%,100%{background-position:-120% 0;}}

  .bx-status{margin-top:44px;width:min(360px,72%);opacity:0;animation:bxLockIn .8s .9s ease forwards;}
  .bx-line{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12.5px;font-weight:500;letter-spacing:.01em;margin-bottom:9px;}
  .bx-msg{color:rgba(255,255,255,.88);display:flex;align-items:center;gap:8px;min-width:0;}
  .bx-msg-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .18s ease,transform .18s ease;}
  .bx-msg-text.swap{opacity:0;transform:translateY(4px);}
  .bx-dots::after{content:"";animation:bxDots 1.2s steps(4,end) infinite;}
  @keyframes bxDots{0%{content:"";}25%{content:".";}50%{content:"..";}75%,100%{content:"...";}}
  .bx.no-dots .bx-dots::after{content:"";animation:none;}
  .bx-pct{color:rgba(255,255,255,.55);font-family:'JetBrains Mono',monospace;font-size:11.5px;flex-shrink:0;}
  .bx-bar{position:relative;height:5px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05);}
  .bx-fill{position:absolute;left:0;top:0;bottom:0;width:0%;border-radius:99px;background:linear-gradient(90deg,#8b5cf6,#d946ef 55%,#fff);box-shadow:0 0 14px rgba(217,70,239,.7);transition:width .35s ease;}
  .bx-fill::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);background-size:200% 100%;animation:bxSweep 1.4s linear infinite;}
  @keyframes bxSweep{from{background-position:200% 0;}to{background-position:-200% 0;}}
  .bx-bar.indet .bx-fill{width:34% !important;transition:none;animation:bxIndet 1.35s cubic-bezier(.6,0,.4,1) infinite;}
  @keyframes bxIndet{0%{left:-34%;}100%{left:100%;}}
  .bx-sub{margin-top:9px;font-size:11px;color:rgba(255,255,255,.45);min-height:14px;text-align:left;}

  .bx-foot{position:absolute;left:18px;right:18px;bottom:14px;display:flex;justify-content:space-between;align-items:center;font-size:11px;color:rgba(255,255,255,.42);letter-spacing:.02em;}
  .bx-chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.09);backdrop-filter:blur(6px);}
  .bx-chip i{width:6px;height:6px;border-radius:50%;background:#a78bfa;box-shadow:0 0 8px #a78bfa;animation:bxBlink 1.2s ease-in-out infinite;}
  .bx-chip.ok i{background:var(--ok);box-shadow:0 0 8px var(--ok);animation:none;}
  .bx-chip.warn i{background:#fbbf24;box-shadow:0 0 8px #fbbf24;animation:none;}
  .bx-chip.err i{background:var(--err);box-shadow:0 0 8px var(--err);animation:none;}
  @keyframes bxBlink{50%{opacity:.3;}}
  body.reduce-motion .bx *{animation-duration:0s !important;}
  body.reduce-motion .bx-lockup,body.reduce-motion .bx-status{opacity:1;transform:none;}
  body.reduce-motion .bx-name span{opacity:1;transform:none;}
  @media (max-width:560px){.bx-name{font-size:42px;}.bx-mark{width:62px;height:62px;}.bx-logo{inset:14px;}.bx-lockup{gap:14px;}}

/* Native, event-driven state additions. No invented percentages or install claims. */
.bx-video{opacity:1;transition:none;}
.bx-name span{opacity:1;transform:none;}
.bx-logo{inset:12px;}
.bx-lockup{opacity:1;transform:none;}
.bx-status{opacity:1;transform:none;width:min(430px,80%);}
.bx-center{padding-bottom:0;}
.bx-mark{width:98px;height:98px;}
.bx-name{font-size:clamp(38px,6vw,64px);}
.bx-msg-text{white-space:normal;line-height:1.4;overflow:visible;}
.bx-line{font-size:14px;min-height:20px;}
.bx-sub{color:rgba(255,255,255,.8);line-height:1.6;font-size:12px;min-height:19px;text-shadow:0 1px 6px #000;}
.bx-pct,.bx-foot{font-size:12px;color:rgba(255,255,255,.75);}
.bx-foot{gap:16px;}
.bx-chip{background:rgba(5,3,13,.5);}
.bx-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;}
.bx-actions[hidden]{display:none;}
.bx-btn{border:1px solid rgba(255,255,255,.22);border-radius:8px;padding:10px 14px;color:#fff;background:rgba(10,7,7,.65);font:500 13px var(--ui-font);cursor:pointer;backdrop-filter:blur(12px);transition:background .18s,border-color .18s;}
.bx-btn.primary{background:#fbbf24;color:#211600;border-color:#fbbf24;}
.bx-btn:hover{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.5);}
.bx-btn.primary:hover{background:#fcd34d;border-color:#fcd34d;}
.bx-btn:focus-visible,.bx-close:focus-visible{outline:2px solid #fbbf24;outline-offset:4px;}
.bx-close{width:32px;height:32px;color:rgba(255,255,255,.85);}
@media(max-width:560px){.bx-mark{width:72px;height:72px}.bx-lockup{gap:10px}.bx-name{font-size:clamp(32px,8.6vw,46px)}.bx-status{margin-top:32px;width:82%}.bx-foot{left:12px;right:12px}.bx-center{padding-bottom:16px}.bx-logo{inset:10px}}
@media(max-height:420px){.bx-center{padding-bottom:12px}.bx-status{margin-top:20px}.bx-mark{width:62px;height:62px}.bx-name{font-size:40px}.bx-actions{margin-top:10px}}
@media(prefers-reduced-motion:reduce){.bx *{animation:none!important;transition:none!important}.bx-lockup,.bx-status,.bx-name span{opacity:1;transform:none}}
/* Logo disc: crops the faint wordmark in icon.png and lifts the dark mascot off the video. */
.bx-logo{inset:9px;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 50% 38%,#4a3a72 0%,#241a3c 55%,#120c1f 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18),0 6px 22px rgba(0,0,0,.5);animation:none;}
.bx-logo img{position:absolute;width:128%;height:128%;left:-16.9%;top:1%;max-width:none;object-fit:contain;filter:drop-shadow(0 0 5px rgba(139,92,246,.7));}
@media(max-width:560px){.bx-logo{inset:7px}}
@media(prefers-reduced-motion:reduce){.bx-mark{animation:none}}
.bx-status{min-height:150px;}
.bx[data-tone=err] .bx-fill{background:linear-gradient(90deg,#ef4444,#fca5a5);box-shadow:0 0 14px rgba(248,113,113,.7);}
.bx[data-tone=ok] .bx-fill{background:linear-gradient(90deg,#22c55e,#bbf7d0);box-shadow:0 0 14px rgba(74,222,128,.55);}
.bx[data-tone=err] .bx-fill::after,.bx[data-tone=ok] .bx-fill::after,.bx[data-tone=warn] .bx-fill::after{animation:none;opacity:0}
</style></head><body>
<!-- ── BOOTSTRAPPER (startup splash + update check) ───────────────────────── -->
<div class="bx bx-video-on" id="bootstrapper" role="region" aria-label="OblivionX is starting">
  
  <video class="bx-video" id="bxVideo" src="bootstrap-bg.mp4" muted loop autoplay playsinline poster="fireplace-poster.jpg" preload="auto" disablepictureinpicture></video>
  <div class="bx-vignette"></div>
  <div class="bx-grain"></div>
  <div class="bx-drag"></div>
  <button class="bx-close" id="bxClose" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>

  <div class="bx-center">
    <div class="bx-lockup">
      <div class="bx-mark">
        <svg class="bx-ring" viewBox="0 0 100 100" aria-hidden="true">
          <circle class="track" cx="50" cy="50" r="45"/>
          <circle class="arc" cx="50" cy="50" r="45"/>
          <circle class="arc2" cx="50" cy="50" r="45"/>
        </svg>
        <div class="bx-logo" id="bxLogo">
          <img src="icon.png" alt="" onerror="this.hidden=true">
        </div>
      </div>
      <div class="bx-name" id="bxName" aria-label="OblivionX"></div>
    </div>

    <div class="bx-status">
      <div class="bx-line" role="status" aria-live="polite">
        <div class="bx-msg"><span class="bx-msg-text bx-dots" id="bxMsg">Starting</span></div>
        <div class="bx-pct" id="bxPct"></div>
      </div>
      <div class="bx-bar indet" id="bxBar"><div class="bx-fill" id="bxFill"></div></div>
      <div class="bx-sub" id="bxSub"></div>
      <div class="bx-actions" id="bxActions" hidden></div>
    </div>
  </div>

  <div class="bx-foot">
    <span class="bx-chip" id="bxChip"><i></i><span id="bxChipText">Checking</span></span>
    <span id="bxVer">OblivionX</span>
  </div>
</div>


<script src="bootstrap.js"></script>
</body></html>
