<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OblivionX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
  <link rel="icon" href="/icons/real-icon.png" />
  <style>
    :root {
      --theme-bg-base: #0D0D0D;
      --theme-bg-surface: #101010;
      --theme-bg-elevated: #151515;
      --theme-bg-active: #1C1C1C;
      --theme-text-primary: #EDEDED;
      --theme-text-secondary: #A0A0A0;
      --theme-text-muted: #666666;
      --theme-line: #1F1F1F;
      --theme-border: #1F1F1F;
      --theme-border-subtle: #191919;
      --theme-accent: #3B82F6;
      --theme-accent-fg: #FFFFFF;
      --theme-accent-soft: rgba(59, 130, 246, 0.15);
      --theme-accent-hover: #2563EB;
    }
    html, body {
      background-color: #0D0D0D;
      color-scheme: dark;
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    /* Dashboard layout */
    .dashboard{display:flex;flex-direction:column;height:100vh;}
    .top-bar{height:56px;background:var(--bg);display:flex;align-items:center;flex-direction:row;flex-shrink:0;border-radius:0;position:relative;z-index:99999;-webkit-app-region:drag;border-bottom:none;}
    .top-bar .brand{display:flex;align-items:center;gap:8px;padding-left:14px;flex-shrink:0;height:100%;position:relative;z-index:1;}
    .top-bar .brand .logo{width:26px;height:26px;flex-shrink:0;position:relative;top:-2.5px;background:var(--accent);opacity:.88;border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--accent-fg);font-weight:600;letter-spacing:.01em;font-family:inherit;transition:color .2s;}
    .top-bar .brand .logo svg{width:18px;height:18px;}
    .top-bar .brand .logo:hover{color:var(--accent-hover);}
    .top-bar .tabs{display:flex;align-items:center;gap:2px;position:absolute;left:50%;transform:translate(-50%);-webkit-user-select:none;user-select:none;z-index:1;-webkit-app-region:no-drag;padding:3px 3px 7px;}
    .tab{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 8px;border-radius:9px;border:none;outline:none;cursor:pointer!important;background:transparent;color:var(--fg3);font-size:12px;font-weight:500;transition:color .15s;white-space:nowrap;position:relative;z-index:1;}
    .tab.active{color:var(--accent);}
    .tab .tab-icon{width:14px;height:14px;flex-shrink:0;opacity:.65;display:flex;align-items:center;justify-content:center;}
    .tab .tab-icon svg{width:100%;height:100%;}
    .settings .tab{height:38px;padding:0 12px;border-radius:9px;border:none;outline:none;cursor:pointer!important;background:transparent;color:var(--fg3);font-size:12px;font-weight:500;transition:color .15s;white-space:nowrap;position:relative;z-index:1;}
    .settings .tab.active{color:var(--accent);}
    /* Account section */
    #acctSection{position:fixed;top:0;right:0;z-index:1000;min-width:200px;background:var(--bg-surface);border-radius:12px;padding:16px;color:var(--fg);display:none;}
    #acctSection .acct-card-header{display:flex;align-items:center;gap:12px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--border-subtle);}
    #acctSection .acct-card-header .acct-card-header-img{width:32px;height:32px;border-radius:50;background:#2c2f3e;flex-shrink:0;}
    #acctSection .acct-card-header .acct-card-header-img img{width:100%;height:100;border-radius:50;object-fit:cover;background:#2c2f3e;}
    #acctSection .acct-card-header .acct-card-header-name{font-size:14;font-weight:500;}
    #acctSection .acct-card-footer{margin-top:12px;display:flex;justify-content:flex-end;gap:8px;}
    #acctSection .acct-sign-in-btn{display:none;padding:6px 12px;background:var(--accent);color:var(--accent-fg);border:none;border-radius:6;cursor:pointer;font-size:12;}
    #acctSection .acct-sign-out-btn{display:none;padding:6px 12px;background:transparent;color:var(--fg);border:1px solid var(--fg);border-radius:6;cursor:pointer;font-size:12;}
    /* Key system */
    .key-system{padding:20px;max-width:600px;margin:40px auto;background:var(--bg-surface);border-radius:12px;}
    .key-system h2{font-size:20px;font-weight:600;color:var(--text-primary);margin-bottom:16px;}
    .key-system .key-input{width:100%;padding:12px;border:1px solid var(--border);border-radius:6;background:var(--bg);color:var(--text);font-size:14;margin-bottom:12px;}
    .key-system .key-btn{width:100%;padding:12px;background:var(--accent);color:var(--accent-fg);border:none;border-radius:6;cursor:pointer;font-size:14;font-weight:500;}
    .key-system .key-btn:disabled{background:#6b7280;cursor:not-allowed;}
    /* Console/terminal */
    .console{flex:1;background:var(--bg);overflow:auto;padding:16px;font-family:var(--ui-font);font-size:13px;line-height:1.9;color:var(--text);}
    .console .log-line{display:flex;gap:10px;animation:logIn .22s ease both;}
    @keyframes logIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
    .log-time{color:var(--text-faint);flex-shrink:0;font-variant-numeric:tabular-nums;}
    .log-ok{color:var(--ok);}
    .log-info{color:var(--text-dim);}
    .log-err{color:var(--err);}
    .log-line.log-hidden{display:none;}
    .console-actions{display:flex;align-items:center;gap:2px;margin-left:auto;}
    .icon-btn.small{width:26px;height:26px;border-radius:5px;}
    .icon-btn.small svg{width:14px;height:14px;}
    /* Keygate overlay */
    .keygate-overlay{position:fixed;inset:0;z-index:700;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(900px 600px at 20% 0%,rgba(139,92,246,0.10),transparent 55%),rgba(4,3,10,0.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);}
    .keygate-overlay[hidden]{display:none;}
    .keygate-card{width:420px;max-width:100%;background:var(--win);border:1px solid var(--border-strong);border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,0.65),0 0 30px rgba(139,92,246,0.08);padding:26px 24px;}
    .keygate-icon{width:44px;height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:var(--accent-dim);color:var(--accent);margin-bottom:16px;}
    .keygate-icon svg{width:22px;height:22px;}
    .keygate-title{font-size:19px;font-weight:600;letter-spacing:-0.01em;margin-bottom:6px;}
    .keygate-desc{font-size:13px;color:var(--text-dim);line-height:1.5;margin-bottom:18px;}
    .keygate-hwid{display:flex;align-items:center;gap:8px;background:var(--editor);border:1px solid var(--border);border-radius:9px;padding:9px 11px;margin-bottom:12px;}
    .keygate-hwid-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-faint);flex-shrink:0;}
    .keygate-hwid-val{flex:1;min-width:0;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .keygate-input{width:100%;background:var(--editor);border:1px solid var(--border-strong);border-radius:9px;padding:12px 13px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:0.03em;outline:none;transition:border-color .15s ease;margin-bottom:12px;}
    .keygate-input:focus{border-color:var(--accent);}
    .keygate-input::placeholder{color:var(--text-faint);}
    .keygate-actions{display:flex;gap:10px;}
    .keygate-btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:9px;padding:12px 16px;font-size:13px;font-weight:600;font-family:var(--ui-font);cursor:pointer;border:1px solid transparent;transition:background .15s ease,opacity .15s ease;}
    .keygate-btn svg{width:15px;height:15px;}
    .keygate-btn.primary{background:var(--accent);color:var(--accent-fg);}
    .keygate-btn.primary:hover:not(:disabled){opacity:.9;}
    .keygate-btn.primary:disabled{opacity:.5;cursor:not-allowed;}
    .keygate-btn.ghost{background:transparent;border-color:var(--border-strong);color:var(--text);}
    .keygate-btn.ghost:hover{background:rgba(168,85,247,0.09);}
    .keygate-msg{font-size:12.5px;margin-top:12px;min-height:16px;color:var(--text-dim);}
    .keygate-msg.ok{color:var(--ok);}
    .keygate-msg.err{color:var(--err);}
    /* Clients page */
    .clients-page{position:fixed;top:0;right:0;bottom:0;width:min(360px,86%);z-index:120;display:flex;flex-direction:column;background:var(--win);border-left:1px solid var(--border-strong);box-shadow:-24px 0 60px rgba(0,0,0,.55);transform:translateX(103%);transition:transform .28s cubic-bezier(.32,.72,.24,1);overflow:hidden;}
    .clients-page.open{transform:none;}
    .clients-page[hidden]{display:none;}
    .clients-header{display:flex;align-items:center;gap:10px;padding:16px 14px 14px 18px;border-bottom:1px solid var(--border);flex-shrink:0;}
    .clients-title{flex:1;min-width:0;font-size:20px;font-weight:700;letter-spacing:0;text-transform:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text);}
    .clients-actions{display:flex;align-items:center;gap:2px;flex-shrink:0;}
    .clients-grid{flex:1;overflow-y:auto;padding:16px 14px;padding-bottom:64px;display:flex;flex-direction:column;gap:8px;scrollbar-width:thin;scrollbar-color:rgba(139,92,246,0.22) transparent;}
    .clients-grid::-webkit-scrollbar{width:8px;}
    .clients-grid::-webkit-scrollbar-track{background:transparent;}
    .clients-grid::-webkit-scrollbar-thumb{background:rgba(139,92,246,0.18);border-radius:8px;border:2px solid var(--editor);}
    .clients-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px 16px 64px;font-size:13px;color:var(--text-faint);text-align:center;}
    .client-card{display:flex;align-items:center;gap:14px;background:var(--toolbar);border:1px solid var(--border);border-radius:9px;padding:12px 16px;transition:border-color .15s ease,box-shadow .15s ease;animation:logIn .22s ease both;}
    .client-card:hover{border-color:var(--border-strong);box-shadow:0 6px 20px rgba(0,0,0,0.4);}
    .client-card.attached{border-color:rgba(168,85,247,0.35);box-shadow:0 0 0 1px rgba(168,85,247,0.15);}
    .client-avatar-wrap{position:relative;flex-shrink:0;width:52px;height:52px;}
    .client-avatar{width:52px;height:52px;border-radius:50;object-fit:cover;background:var(--gutter);display:block;}
    .client-avatar-ph{width:52px;height:52px;border-radius:50;background:var(--gutter);display:flex;align-items:center;justify-content:center;color:var(--text-faint);}
    .client-avatar-ph svg{width:22px;height:22px;}
    .client-attach-dot{position:absolute;bottom:2px;right:2px;width:11px;height:11px;border-radius:50;border:2px solid var(--toolbar);background:var(--text-faint);}
    .client-card.attached .client-attach-dot{background:var(--ok);box-shadow:0 0 6px rgba(126,231,135,0.5);}
    .client-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
    .client-username{font-size:14px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .client-user-handle{font-size:11px;color:var(--text-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .client-game-row{display:flex;align-items:center;gap:8px;min-width:0;}
    .client-game-icon{width:28px;height:28px;border-radius:6;object-fit:cover;background:var(--gutter);flex-shrink:0;}
    .client-game-details{min-width:0;display:flex;flex-direction:column;gap:2px;}
    .client-place-id{font-size:10px;color:var(--text-faint);font-family:'JetBrains Mono',monospace;}
    .client-attach-btn{flex-shrink:0;margin-left:auto;padding:7px 12px;border:1px solid var(--border-strong);border-radius:6;color:var(--text);background:rgba(168,85,247,0.12);font:500 12px var(--ui-font);cursor:pointer;transition:background .15s ease,border-color .15s ease;}
    .client-attach-btn:hover:not(:disabled){background:rgba(168,85,247,0.22);border-color:var(--accent);}
    .client-attach-btn:disabled{opacity:.6;cursor:default;}
    .client-card.attached .client-attach-btn{color:var(--ok);background:rgba(126,231,135,0.08);border-color:rgba(126,231,135,0.25);}
    .client-game{font-size:12px;color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .client-meta{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-faint);font-family:'JetBrains Mono',monospace;margin-top:2px;}
    .client-status-dot{display:inline-block;width:6px;height:6px;border-radius:50;background:var(--text-faint);flex-shrink:0;}
    .client-card.attached .client-status-dot{background:var(--ok);}
    /* Settings page */
    .settings-page{flex:1;min-height:0;display:flex;}
    .settings-page[hidden]{display:none;}
    .settings-nav{width:212px;flex-shrink:0;padding:18px 12px;display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--border);overflow-y:auto;}
    .settings-nav-section{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-faint);padding:10px 10px 6px;}
    .settings-nav-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:7;border:none;background:transparent;color:var(--text-dim);font-family:var(--ui-font);font-size:13px;font-weight:500;cursor:pointer;text-align:left;transition:background .15s ease,color .15s ease;}
    .settings-nav-item svg{width:16px;height:16px;flex-shrink:0;opacity:.8;}
    .settings-nav-item:hover{background:rgba(168,85,247,0.07);color:var(--text);}
    .settings-nav-item.active{background:rgba(168,85,247,0.13);color:var(--accent);box-shadow:inset 2px 0 0 var(--accent);}
    .settings-content{flex:1;min-width:0;overflow-y:auto;padding:20px;scrollbar-width:thin;scrollbar-color:rgba(139,92,246,0.22) transparent;}
    .settings-pane{display:none;}
    .settings-pane.active{display:block;}
    .settings-card{display:flex;align-items:center;gap:14px;background:var(--toolbar);border:1px solid var(--border);border-radius:9px;padding:14px 16px;transition:border-color .15s ease;}
    .settings-card:hover{border-color:var(--border-strong);}
    .settings-card + .settings-card{margin-top:10px;}
    .mini-btn{background:rgba(139,92,246,0.08);border:1px solid var(--border-strong);color:var(--text);font-family:var(--ui-font);font-size:12px;font-weight:500;padding:7px 13px;border-radius:6;cursor:pointer;transition:background .15s ease,border-color .15s ease;}
    .mini-btn:hover{background:rgba(139,92,246,0.15);border-color:rgba(168,85,247,0.35);}
    .mini-btn.danger{color:var(--err);border-color:color-mix(in srgb,var(--err) 40%,transparent);}
    .mini-btn.danger:hover{background:color-mix(in srgb,var(--err) 12%,transparent);}
    .mini-btn.danger.armed{background:color-mix(in srgb,var(--err) 20%,transparent);border-color:var(--err);}
    .accent-picker{display:flex;align-items:center;gap:7px;}
    .accent-swatch{position:relative;width:20px;height:20px;border-radius:50;background:var(--sw,var(--accent));border:1px solid rgba(255,255,255,0.18);cursor:pointer;padding:0;flex-shrink:0;transition:transform .12s ease,box-shadow .12s ease;}
    .accent-swatch:hover{transform:scale(1.12);}
    .accent-swatch.active{box-shadow:0 0 0 2px var(--titlebar),0 0 0 4px var(--sw,var(--accent)),0 0 12px var(--sw,var(--accent-glow));}
    .accent-swatch-custom{background:conic-gradient(#ff7b72,#fbbf24,#5eead4,#8ab4f8,#a78bfa,#f472b6,#ff7b72);display:flex;overflow:hidden;}
    .accent-swatch-custom.active{box-shadow:0 0 0 2px var(--titlebar),0 0 0 4px var(--accent);}
    .color-picker{position:fixed;z-index:220;width:212px;padding:10px;border-radius:10;background:#0d0b1a;border:1px solid var(--border-strong);box-shadow:0 18px 44px rgba(0,0,0,0.65),0 0 20px rgba(139,92,246,0.08);display:flex;flex-direction:column;gap:10px;animation:pageIn .14s ease-out;}
    .color-picker[hidden]{display:none;}
    .color-sv{position:relative;height:124px;border-radius:7;cursor:crosshair;background:linear-gradient(to top,#000,rgba(0,0,0,0)),linear-gradient(to right,#fff,var(--hue-color,#f00));}
    .color-sv-thumb,.color-hue-thumb{position:absolute;border-radius:50;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,0.45),0 1px 4px rgba(0,0,0,0.5);pointer-events:none;}
    .color-sv-thumb{width:12px;height:12px;transform:translate(-50%,-50%);}
    .color-hue{position:relative;height:12;border-radius:999;cursor:pointer;background:linear-gradient(to right,#f00,#ff0,#0f0,#0f,#00f,#f0f,#f00);}
    .color-hue-thumb{top:50;width:14;height:14;background:transparent;transform:translate(-50%,-50%);}
    .color-foot{display:flex;align-items:center;gap:8px;}
    .color-preview{width:24;height:24;border-radius:6;border:1px solid rgba(168,85,247,0.3);background:var(--preview-color,var(--accent));}
    .color-hex{flex:1;min-width:0;height:26;padding:0 8;border-radius:6;border:1px solid var(--border-strong);background:rgba(139,92,246,0.05);color:var(--text);font-family:inherit;font-size:12;letter-spacing:.04em;outline:none;text-transform:lowercase;}
    .color-hex:focus{border-color:rgba(168,85,247,0.45);}
    .settings-card-icon{width:34;height:34;border-radius:8;display:flex;align-items:center;justify-content:center;background:rgba(139,92,246,0.08);}
    .settings-card-icon svg{width:18;height:18;color:var(--accent);opacity:0.8;}
    .settings-card-text{flex:1;min-width:0;}
    .settings-card-title{font-size:13;font-weight:600;color:var(--text);}
    .settings-card-desc{font-size:11.5;color:var(--text-faint);margin-top:2px;}
    .settings-card-control{display:flex;align-items:center;gap:9;flex-shrink:0;}
    .settings-card-state{font-size:12;font-weight:5;color:var(--text-dim);min-width:22;}
    /* Console styles */
    .console-body{flex:1;padding:14px 16px;font-family:var(--ui-font);font-size:13;line-height:1.9;overflow-y:auto;display:flex;flex-direction:column;gap:2;scrollbar-width:thin;scrollbar-color:rgba(139,92,246,0.22) transparent;}
    .console-body::-webkit-scrollbar{width:8;}
    .console-body::-webkit-scrollbar-track{background:transparent;}
    .console-body::-webkit-scrollbar-thumb{background:rgba(139,92,246,0.18);border-radius:8;border:2solid var(--console);}
    .console-body::-webkit-scrollbar-thumb:hover{background:rgba(139,92,246,0.32);}
    .log-line{display:flex;gap:10;animation:logIn .22s ease both;}
    @keyframes logIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
    .log-time{color:var(--text-faint);flex-shrink:0;font-variant-numeric:tabular-nums;}
    .log-ok{color:var(--ok);}
    .log-info{color:var(--text-dim);}
    .log-err{color:var(--err);}
    .log-line.log-hidden{display:none;}
    .console-body.hide-timestamps .log-time{display:none;}
    .bracket-grey{color:#5a5480!important;}
    /* UI state classes */
    .ui-state-idle{color:var(--text-dim);}
    .ui-state-attached{color:var(--ok);}
    /* Animations */
    @keyframes pageIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
    .page-enter{animation:pageIn .22s cubic-bezier(.22,.61,.36,1);}
    /* Tips */
    [data-tip]{position:relative;}
    [data-tip]::after{content:attr(data-tip);position:absolute;bottom:calc(100%+9px);right:0;transform:translateY(4px);background:#0d0b1a;color:var(--text);font-size:11;font-weight:5;letter-spacing:0.01em;padding:5;9;border-radius:5;white-space:nowrap;border:1solid var(--border-strong);box-shadow:0 8,20px rgba(0,0,0,0.55),0,12px rgba(139,92,246,0.08);opacity:0;pointer-events:none;transition:opacity .12s ease,transform .12s ease;z-index:50;}
    [data-tip]::before{content:"";position:absolute;bottom:calc(100%+4px);right:10;border:5solid transparent;border-top-color:#0d0b1a;opacity:0;transition:opacity .12s ease;pointer-events:none;z-index:50;}
    [data-tip]:hover::after{opacity:1;transform:translateY(0);}
    [data-tip]:hover::before{opacity:1;}
    /* Floating tip */
    .float-tip{position:fixed;left:0;top:0;background:#0d0b1a;color:var(--text);font-size:11;font-weight:5;letter-spacing:0.01em;padding:5,9;border-radius:5;white-space:nowrap;border:1solid var(--border-strong);box-shadow:0 8px 20px rgba(0,0,0,0.55);opacity:0;transform:translateY(4);pointer-events:none;transition:opacity .12s ease,transform .12s ease;z-index:60;display:flex;align-items:center;gap:6;}
    .float-tip.open{opacity:1;transform:translateY(0);}
    .float-tip-dot{width:7;height:7;border-radius:50;background:var(--group-color,var(--text-dim));flex-shrink:0;}
    /* Toolbar */
    .toolbar{display:flex;align-items:center;justify-content:space-between;padding:9;background:var(--toolbar);}
    .tool-group{display:flex;align-items:center;gap:4;}
    .tool-btn{display:flex;align-items:center;gap:7;padding:7,12;border-radius:6;font-size:13;font-weight:5;color:var(--text-dim);background:transparent;border:none;cursor:pointer;font-family:var(--ui-font);transition:background .15s ease,color .15s ease;}
    .tool-btn svg{width:15;height:15;}
    .tool-btn:hover{background:rgba(168,85,247,0.1);color:var(--text);}
    .tool-btn.primary{color:var(--text);background:rgba(168,85,247,0.12);border:1solid rgba(168,85,247,0.25);box-shadow:0,0,14px rgba(168,85,247,0.08);}
    .tool-btn.primary svg{color:var(--accent);}
    .tool-btn.primary:hover{background:rgba(168,85,247,0.2);border-color:rgba(168,85,247,0.45);box-shadow:0,0,20px rgba(168,85,247,0.18);}
    /* Tabs */
    .tab{display:flex;align-items:center;gap:8;padding:0,12;height:38;border-radius:7,7,0;font-size:13;font-weight:5;color:var(--text-dim);background:transparent;white-space:nowrap;cursor:pointer;transition:background .15s ease,color .15s ease;}
    .tab:hover{color:var(--text);background:rgba(168,85,247,0.06);}
    .tab.active{background:var(--tab-active);color:var(--text);border-radius:7,7,0;box-shadow:inset 0,2,0 var(--accent);}
    .tab.active::before,.tab.active::after{content:"";position:absolute;bottom:0;width:14;height:14;pointer-events:none;}
    .tab.active::before{left:-14;background:radial-gradient(circle at top left,transparent 14,var(--tab-active) 14);}
    .tab.active::after{right:-14;background:radial-gradient(circle at top right,transparent 14,var(--tab-active) 14);}
    .tab-icon{width:14;height:14;flex-shrink:0;opacity:.65;display:flex;}
    .tab-icon svg{width:10;height:10;}
    .tab-close-slot{position:relative;width:16;height:16;flex-shrink:0;}
    .tab-dirty-dot{position:absolute;top:50;left:50;margin:-3,5,0 -3,5;border-radius:5;background:var(--accent);opacity:0;transition:opacity .1s ease;pointer-events:none;box-shadow:0,0,6px var(--accent-glow);}
    .tab.dirty .tab-dirty-dot{opacity:1;}
    .tab-close-slot:hover .tab-dirty-dot{opacity:0;}
    .tab-close{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:4;color:var(--text-faint);flex-shrink:0;opacity:1;transition:opacity .1s ease,background .15s ease;}
    .tab.dirty .tab-close{opacity:0;}
    .tab-close:hover{background:rgba(168,85,247,0.14);color:var(--accent);}
    .tab-close svg{width:10;height:10;}
    .tab-add{display:flex;align-items:center;justify-content:center;width:32;height:32;margin:0,0,0,4;align-self:center;border-radius:6;color:var(--text-dim);flex-shrink:0;cursor:pointer;transition:background .15s ease,color .15s ease;}
    .tab-add:hover{background:rgba(168,85,247,0.1);color:var(--accent);}
    .tab-add svg{width:14;height:14;}
    /* Sidebar */
    .app-shell{display:flex;flex:1;min-height:0;}
    .app-sidebar{width:56;flex-shrink:0;background:var(--titlebar);border-right:1solid var(--border);display:flex;align-items:center;flex-direction:column;padding:12,6;}
    .app-sidebar .icon-btn{width:38;height:38;}
    .page-host{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden;}
    /* Keygate styles from old UI */
    .keygate-overlay{position:fixed;inset:0;z-index:700;display:flex;align-items:center;justify-content:center;padding:24;background:radial-gradient(900px,600px at 20,0%,rgba(139,92,246,0.10),transparent 55%),rgba(4,3,10,0.86);backdrop-filter:blur(10);-webkit-backdrop-filter:blur(10);}
    .keygate-overlay[hidden]{display:none;}
    .keygate-card{width:420;max-width:100;background:var(--win);border:1solid var(--border-strong);border-radius:14;box-shadow:0,24px,60px rgba(0,0,0,0.65),0,0,30px rgba(139,92,246,0.08);padding:26,24;}
    .keygate-icon{width:44;height:44;border-radius:11;display:flex;align-items:center;justify-content:center;background:var(--accent-dim);color:var(--accent);margin-bottom:16;}
    .keygate-icon svg{width:22;height:22;}
    .keygate-title{font-size:19;font-weight:6;letter-spacing:-0.01em;margin-bottom:6;}
    .keygate-desc{font-size:13;color:var(--text-dim);line-height:1.5;margin-bottom:18;}
    .keygate-hwid{display:flex;align-items:center;gap:8;background:var(--editor);border:1solid var(--border);border-radius:9;padding:9,11;margin-bottom:12;}
    .keygate-hwid-label{font-size:10;font-weight:6;text-transform:uppercase;letter-spacing:0.08;color:var(--text-faint);flex-shrink:0;}
    .keygate-hwid-val{flex:1;min-width:0;font-family:'JetBrains Mono',monospace;font-size:11.5;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .keygate-input{width:100;background:var(--editor);border:1solid var(--border-strong);border-radius:9;padding:12,13;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:13;letter-spacing:0.03;outline:none;transition:border-color .15s ease;margin-bottom:12;}
    .keygate-input:focus{border-color:var(--accent);}
    .keygate-input::placeholder{color:var(--text-faint);}
    .keygate-actions{display:flex;gap:10;}
    .keygate-btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:7;border-radius:9;padding:12,16;font-size:13;font-weight:6;font-family:var(--ui);cursor:pointer;border:1solid transparent;transition:background .15s ease,opacity .15s ease;}
    .keygate-btn svg{width:15;height:15;}
    .keygate-btn.primary{background:var(--accent);color:var(--accent-fg);}
    .keygate-btn.primary:hover:not(:disabled){opacity:.9;}
    .keygate-btn.primary:disabled{opacity:.5;cursor:not-allowed;}
    .keygate-btn.ghost{background:transparent;border-color:var(--border-strong);color:var(--text);}
    .keygate-btn.ghost:hover{background:rgba(168,85,247,0.09);}
    .keygate-msg{font-size:12,5;margin-top:12;min-height:16;color:var(--text-dim);}
    .keygate-msg.ok{color:var(--ok);}
    .keygate-msg.err{color:var(--err);}
</style>
</head>
<body>
  <div class="dashboard">
    <!-- Top bar -->
    <div class="top-bar">
      <div class="brand">
        <div class="logo">O</div>
      </div>
      <div class="tabs" id="tabs">
        <!-- Tabs will be injected here -->
      </div>
    </div>
    
    <!-- Account section -->
    <div id="acctSection">
      <div class="acct-card">
        <div class="acct-card-header">
          <div class="acct-card-header-img">
            <img id="acctAvatar" alt="">
          </div>
          <div class="acct-card-header-name" id="acctUsername"></div>
        </div>
        <div class="acct-card-footer">
          <button class="acct-sign-in-btn">Sign in with Discord</button>
          <button class="acct-sign-out-btn">Sign out</button>
        </div>
      </div>
    </div>
    
    <div class="console" id="console" readonly>
      <!-- Console content injected by JS -->
    </div>
    
    <!-- Keygate overlay (hidden by default, shown when no key) -->
    <div class="keygate-overlay" id="keygate-overlay">
      <div class="keygate-card">
        <div class="keygate-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </div>
        <h3 class="keygate-title">Activate OblivionX</h3>
        <p class="keygate-desc">Enter your activation key to unlock full features</p>
        <div class="keygate-hwid">
          <span class="keygate-hwid-label">HWID</span>
          <span class="keygate-hwid-val" id="hwid-val">Loading...</span>
        </div>
        <input class="keygate-input" type="text" placeholder="Enter activation key" id="keygate-input">
        <div class="keygate-actions">
          <button class="keygate-btn primary" id="keygate-activate">Activate</button>
          <button class="keygate-btn ghost" id="keygate-cancel">Cancel</button>
        </div>
        <p class="keygate-msg ok" id="keygate-msg-ok" style="display:none;"></p>
        <p class="keygate-msg err" id="keygate-msg-err" style="display:none;"></p>
      </div>
    </div>
    
    <!-- Main content area -->
    <div class="app-shell">
      <div class="app-sidebar" id="sidebar">
        <div class="app-nav">
          <div class="tab" data-page="clients" role="tab">Clients</div>
          <div class="tab" data-page="console" role="tab">Console</div>
          <div class="tab" data-page="settings" role="tab">Settings</div>
        </div>
      </div>
      <div class="page-host" id="page-host">
        <!-- Pages will be injected here -->
      </div>
    </div>
  </div>

  <script>
    // API Endpoint configuration
    window.__API_ENDPOINT = 'https://api.real.invalid';
    // Backward compatibility fallback
    if (!window.__API_ENDPOINT) {
      window.__API_ENDPOINT = 'https://api.oblivionx.invalid';
    }
    
    // Initial data
    const uiData = {
      base: "",
      loading: true,
      error: null,
      data: {}
    };
    
    // Initialize state
    const state = {
      currentPage: 'clients',
      attachedClients: [],
      isAttached: false,
      keyValid: false,
      keyCode: '',
      discordSignedIn: false,
      discordUsername: '',
      discordAvatar: ''
    };
    
    // DOM elements
    const elements = {
      console: document.getElementById('console'),
      sidebar: document.getElementById('sidebar'),
      pageHost: document.getElementById('page-host'),
      tabs: document.getElementById('tabs'),
      acctSection: document.getElementById('acctSection'),
      acctAvatar: document.getElementById('acctAvatar'),
      acctUsername: document.getElementById('acctUsername'),
      keygateOverlay: document.getElementById('keygate-overlay'),
      keygateInput: document.getElementById('keygate-input'),
      keygateActivate: document.getElementById('keygate-activate'),
      keygateCancel: document.getElementById('keygate-cancel'),
      keygateMsgOk: document.getElementById('keygate-msg-ok'),
      keygateMsgErr: document.getElementById('keygate-msg-err'),
      hwidVal: document.getElementById('hwid-val')
    };
    
    // Initialize UI
    function initUI() {
      // Setup tabs
      setupTabs();
      
      // Setup account section
      setupAccountSection();
      
      // Setup keygate
      setupKeygate();
      
      // Setup console
      setupConsole();
      
      // Show initial page
      showPage('clients');
    }
    
    // Tab setup
    function setupTabs() {
      const tabs = elements.tabs;
      // Initial tab setup
      const initialTab = document.querySelector('.tab.active');
      if (initialTab) {
        showPage('clients');
      }
    }
    
    // Account section setup
    function setupAccountSection() {
      // Check if already signed in
      const isSignedIn = localStorage.getItem('discordSignedIn') === 'true';
      if (isSignedIn) {
        showAccountSection(true);
        elements.acctAvatar.src = localStorage.getItem('discordAvatar') || 'https://cdn.discordapp.com/embed/avatars/0.png';
        elements.acctUsername.textContent = localStorage.getItem('discordUsername') || 'User';
        elements.acctSignInBtn.style.display = 'none';
        elements.acctSignOutBtn.style.display = '';
      }
    }
    
    // Keygate setup
    function setupKeygate() {
      const hwid = getMachineGuid();
      if (hwid) {
        elements.hwidVal.textContent = hwid;
      }
    }
    
    // Get machine GUID
    function getMachineGuid() {
      try {
        const regPath = 'HKEY_LOCAL_MACHINE\\SOFTWARE\\Microsoft\\Cryptography';
        // In browser, we'll use a fallback
        return 'unknown-machine';
      } catch (e) {
        return 'unknown-machine';
      }
    }
    
    // Show page
    function showPage(page) {
      state.currentPage = page;
      
      // Update tabs
      document.querySelectorAll('.tab').forEach(tab => {
        tab.classList.toggle('active', tab.dataset.page === page);
      });
      
      // Hide all pages
      document.querySelectorAll('.page').forEach(page => {
        page.style.display = 'none';
      });
      
      // Show selected page
      const pageElement = document.getElementById(page + '-page');
      if (pageElement) {
        pageElement.style.display = 'block';
      }
    }
    
    // Setup console
    function setupConsole() {
      const consoleEl = elements.console;
      const logs = [
        ['OblivionX', 'System', 'online', ''],
        ['UI', 'Loaded', '', ''],
        ['Key', 'System', 'ready', '']
      ];
      
      logs.forEach(log => {
        const line = document.createElement('div');
        line.className = 'log-line';
        line.innerHTML = `<span class="log-time">${log[0]}</span><span class="log-time">${log[1]}</span><span class="log-${log[2] || 'info'}">${log[3]}</span>`;
        consoleEl.appendChild(line);
      });
      
      // Scroll to bottom
      consoleEl.scrollTop = consoleEl.scrollHeight;
    }
    
    // Key activation
    function activateKey() {
      const key = elements.keygateInput.value.trim();
      if (!key) return;
      
      // Show loading state
      elements.keygateActivate.disabled = true;
      elements.keygateActivate.textContent = 'Activating...';
      
      // Simulate key activation
      setTimeout(() => {
        elements.keygateActivate.disabled = false;
        elements.keygateActivate.textContent = 'Activate';
        
        // Hide keygate
        elements.keygateOverlay.style.display = 'none';
        
        // Show success
        elements.keygateMsgOk.textContent = 'Key activated successfully!';
        elements.keygateMsgOk.style.display = 'block';
        
        // Update state
        state.keyValid = true;
      }, 1500);
    }
    
    // Discord sign-in
    function signInDiscord() {
      // Simulate Discord sign-in
      state.discordSignedIn = true;
      state.discordUsername = 'OblivionUser';
      state.discordAvatar = 'https://cdn.discordapp.com/embed/avatars/0.png';
      
      localStorage.setItem('discordSignedIn', 'true');
      localStorage.setItem('discordUsername', 'OblivionUser');
      localStorage.setItem('discordAvatar', 'https://cdn.discordapp.com/embed/avatars/0.png');
      
      showAccountSection(true);
      elements.acctAvatar.src = state.discordAvatar;
      elements.acctUsername.textContent = state.discordUsername;
      elements.acctSignInBtn.style.display = 'none';
      elements.acctSignOutBtn.style.display = '';
    }
    
    // Sign out Discord
    function signOutDiscord() {
      state.discordSignedIn = false;
      state.discordUsername = '';
      state.discordAvatar = '';
      
      localStorage.removeItem('discordSignedIn');
      localStorage.removeItem('discordUsername');
      localStorage.removeItem('discordAvatar');
      
      showAccountSection(false);
    }
    
    // Show account section
    function showAccountSection(signedIn) {
      elements.acctSection.style.display = signedIn ? 'block' : 'none';
      elements.acctSignInBtn.style.display = signedIn ? 'none' : '';
      elements.acctSignOutBtn.style.display = signedIn ? '' : 'none';
    }
    
    // Initialize on load
    document.addEventListener('DOMContentLoaded', initUI);
  </script>
</body>
</html>
