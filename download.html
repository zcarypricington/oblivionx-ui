<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Connecting — OblivionX</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="96x96" href="favicon-96x96.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --base: #050505;
      --card: #101013;
      --line: rgba(255,255,255,0.09);
      --line-2: rgba(255,255,255,0.16);
      --blue: #7aa5ff;
      --text: #f2f2f4;
      --muted: #8e8e93;
      --dim: #4a4a4e;
      --ok: #35d07f;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--base);
      color: var(--text);
      font-family: 'Inter', -apple-system, sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    .dots {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image: radial-gradient(rgba(255,255,255,0.13) 1px, transparent 1.4px);
      background-size: 22px 22px;
      mask-image: radial-gradient(ellipse 80% 70% at 50% 50%, black 10%, transparent 75%);
      -webkit-mask-image: radial-gradient(ellipse 80% 70% at 50% 50%, black 10%, transparent 75%);
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .ring-wrap { position: relative; width: 72px; height: 72px; margin: 0 auto 32px; }
    .ring {
      width: 72px; height: 72px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.1);
      border-top-color: var(--blue);
      animation: spin 1.3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      position: absolute; inset: 0;
    }
    .ring-inner {
      position: absolute; inset: 12px; border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.07);
      border-top-color: rgba(122,165,255,0.6);
      animation: spin 2s cubic-bezier(0.4, 0, 0.2, 1) reverse infinite;
    }
    .ring-icon {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .ring-icon svg { width: 20px; height: 20px; color: var(--blue); }

    .card {
      position: relative; z-index: 1;
      background: var(--card);
      border: 1px solid var(--line-2);
      border-radius: 20px;
      padding: 50px 42px 40px;
      max-width: 400px; width: 100%;
      text-align: center;
      box-shadow: 0 40px 90px rgba(0,0,0,0.6);
      animation: cardIn .7s ease both;
    }
    @keyframes cardIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
    .card-eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--blue); margin-bottom: 12px;
    }
    .card-title { font-size: 23px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 8px; }
    .card-sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px; color: var(--muted);
      line-height: 1.7; margin-bottom: 28px;
    }
    .log-block {
      background: rgba(0,0,0,0.4);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 15px 17px;
      text-align: left;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      line-height: 2;
      margin-bottom: 26px;
      overflow: hidden;
    }
    .log-line { display: flex; gap: 10px; align-items: center; transition: opacity .4s ease; }
    .log-line .op { min-width: 42px; font-weight: 600; }
    .log-line .op.get { color: var(--ok); }
    .log-line .op.auth { color: var(--blue); }
    .log-line .op.redir { color: var(--muted); }
    .log-line .msg { color: var(--muted); }
    .log-line.live .msg { color: var(--text); }
    .progress-track {
      height: 3px; border-radius: 2px;
      background: rgba(255,255,255,0.08);
      overflow: hidden; margin-bottom: 24px;
    }
    .progress-fill {
      height: 100%; border-radius: 2px;
      background: #f2f2f4;
      width: 0%;
    }
    .fallback { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: var(--dim); }
    .fallback a { color: var(--muted); text-decoration: none; border-bottom: 1px solid var(--dim); }
    .fallback a:hover { color: var(--text); }
    .home-link {
      display: inline-block; margin-top: 16px;
      font-family: 'JetBrains Mono', monospace; font-size: 10.5px;
      color: var(--dim); text-decoration: none; letter-spacing: 0.06em;
    }
    .home-link:hover { color: var(--muted); }
    @media (prefers-reduced-motion: reduce) {
      .ring, .ring-inner { animation: none; }
      .card { animation: none; }
    }
  </style>
</head>
<body>
  <div class="dots" aria-hidden="true"></div>

  <div class="card">
    <div class="ring-wrap">
      <div class="ring"></div>
      <div class="ring-inner"></div>
      <div class="ring-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 4.5 13.5H11L9.5 22 19 10h-6.5L13 2z"/></svg></div>
    </div>

    <p class="card-eyebrow">OblivionX Installer</p>
    <p class="card-title">Requesting access</p>
    <p class="card-sub">
      Verifying connection and fetching<br>the latest build from our cluster.
    </p>

    <div class="log-block" id="logBlock">
      <div class="log-line live" id="l1">
        <span class="op get">GET</span>
        <span class="msg">/api/v3/download</span>
      </div>
      <div class="log-line" id="l2" style="opacity:0.3">
        <span class="op auth">AUTH</span>
        <span class="msg">token_pending...</span>
      </div>
      <div class="log-line" id="l3" style="opacity:0.15">
        <span class="op redir">REDIR</span>
        <span class="msg">awaiting mirror...</span>
      </div>
    </div>

    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <p class="fallback">
      Not redirecting? <a href="https://github.com/OblivionXDevelopmentinc/obx-install/releases/latest/download/Installer.exe">Force download</a>
    </p>
    <a class="home-link" href="index.html">← back to home</a>
  </div>

  <script>
    const DL = "https://github.com/OblivionXDevelopmentinc/obx-install/releases/latest/download/Installer.exe";
    const fill = document.getElementById('progressFill');
    const l2 = document.getElementById('l2');
    const l3 = document.getElementById('l3');

    // progress animation (eased, completes ~2.5s)
    let pct = 0;
    const step = () => {
      if (pct < 100) {
        pct += pct < 60 ? 2.5 : pct < 85 ? 1.2 : 0.6;
        fill.style.width = Math.min(pct, 100) + '%';
        requestAnimationFrame(step);
      }
    };
    requestAnimationFrame(step);

    // log lines animate in
    setTimeout(() => { l2.style.opacity = '1'; l2.classList.add('live'); l2.querySelector('.msg').textContent = 'token_verified'; }, 600);
    setTimeout(() => { l3.style.opacity = '1'; l3.classList.add('live'); l3.querySelector('.msg').textContent = 'redirecting to mirror...'; }, 1400);
    setTimeout(() => { window.location.href = DL; }, 2500);
  </script>
</body>
</html>
